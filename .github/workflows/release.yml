# Publication d'une version de Yume Novel.
#
# Déclenché par un tag vX.Y.Z (ou vX.Y.Z-suffixe pour une préversion), ou relancé à la main sur ce
# tag (Actions → Release → Run workflow) si sa pose n'a pas créé de run :
#   1. vérifie le tag : format, versions du plugin (en-tête et YUME_CORE_VERSION) et du thème
#      identiques au tag, et, pour une version stable, commit présent sur la branche par défaut ;
#   2. reprend la CI de la pull request fusionnée si elle a réussi sur exactement le même contenu
#      que le tag (même arbre de fichiers) ; sinon rejoue toute la CI (ci.yml) ;
#   3. après approbation humaine (environnement protégé « release », relecteurs obligatoires),
#      construit dist/yume-core.zip et dist/yume.zip, contrôle SHA256SUMS (les deux archives,
#      noms nus) et crée la release GitHub avec ces deux archives + SHA256SUMS.
#
# Les sites refusent d'installer une archive dont l'empreinte SHA-256 ne figure pas, identique,
# dans le SHA256SUMS de la même release (yume-core, includes/updater/integrite.php).
# Réglages GitHub à appliquer (tags v* protégés, environnement release, 2FA…) :
# docs/05-pipeline-github-wordpress.md, « Sécurité de la chaîne de publication ».
#
# Les sites équipés de yume-core vérifient la dernière release toutes les 12 heures et installent
# la mise à jour (automatiquement si « Mises à jour automatiques » est coché dans Yume → Réglages).
# Une préversion (v2.1.0-beta.1) est publiée comme « pre-release » : les sites l'ignorent.
#
# Règle de l'équipe (docs/06-contrat-technique.md §0 bis) : aucun tag v* sans le « Go » explicite.
# Procédure complète : docs/guide-developpeur.md, « Publier une version ».
name: Release

on:
  push:
    tags: ['v*']
  # Relance manuelle (Actions → Release → Run workflow, « Use workflow from » : le tag vX.Y.Z),
  # si la pose du tag n'a pas déclenché de run. Mêmes contrôles, même CI, même approbation.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: Tag et versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      preversion: ${{ steps.tag.outputs.preversion }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
          tools: none

      - name: Lancé sur un tag
        if: ${{ github.ref_type != 'tag' }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::Run lancé sur « $REF » : choisir le tag vX.Y.Z dans « Use workflow from » (onglet Tags), pas une branche."
          exit 1

      - name: Format du tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag « $TAG » invalide : attendu vX.Y.Z ou vX.Y.Z-suffixe (ex. v2.1.0, v2.1.0-beta.1)."
            exit 1
          fi
          preversion=false
          case "$version" in *-*) preversion=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "preversion=$preversion" >> "$GITHUB_OUTPUT"
          echo "Version $version (préversion : $preversion)"

      - name: Versions du plugin et du thème identiques au tag
        run: tools/build/zip.sh --version-attendue "${{ steps.tag.outputs.version }}"

      - name: Version stable publiée depuis la branche par défaut
        if: ${{ steps.tag.outputs.preversion == 'false' }}
        env:
          BRANCHE: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BRANCHE"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCHE"; then
            echo "::error::Le tag ${{ github.ref_name }} ne pointe pas sur un commit de $BRANCHE : une version stable se publie depuis $BRANCHE (utiliser un suffixe -beta.N pour tester une autre branche)."
            exit 1
          fi

  # La CI a déjà tourné sur la pull request : inutile de la rejouer si le tag porte exactement
  # le contenu testé (tête de la PR à jour avec main au moment de la fusion).
  ci_validee:
    name: CI de la pull request
    needs: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      validee: ${{ steps.pr.outputs.validee }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull request fusionnée, même contenu que le tag, CI réussie
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          validee=false
          arbre=$(git rev-parse "$GITHUB_SHA^{tree}")
          for tete in $(gh api "repos/$DEPOT/commits/$GITHUB_SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            if ! git cat-file -e "$tete^{commit}" 2>/dev/null; then
              echo "Tête $tete absente de l'historique (fusion écrasée ?) : ignorée."
              continue
            fi
            if [ "$(git rev-parse "$tete^{tree}")" != "$arbre" ]; then
              echo "Tête $tete : contenu différent du tag (branche pas à jour avec main à la fusion)."
              continue
            fi
            conclusion=$(gh api "repos/$DEPOT/actions/workflows/ci.yml/runs?head_sha=$tete&event=pull_request&status=completed" \
              --jq '[.workflow_runs[]] | sort_by(.run_started_at) | last | .conclusion // ""')
            echo "Tête $tete : même contenu que le tag, CI de la pull request « ${conclusion:-absente} »."
            if [ "$conclusion" = success ]; then
              validee=true
              break
            fi
          done
          echo "validee=$validee" >> "$GITHUB_OUTPUT"
          if [ "$validee" = true ]; then
            echo "CI déjà réussie sur ce contenu : pas de nouvelle exécution."
          else
            echo "Aucune CI réussie sur ce contenu exact : la CI complète est rejouée."
          fi

  ci:
    name: CI
    needs: [verifier, ci_validee]
    if: ${{ needs.ci_validee.outputs.validee != 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publier:
    name: Release GitHub
    needs: [verifier, ci_validee, ci]
    # CI rejouée et verte, ou sautée parce que celle de la pull request couvre ce contenu.
    if: ${{ !cancelled() && needs.verifier.result == 'success' && needs.ci_validee.result == 'success' && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && needs.ci_validee.outputs.validee == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Environnement protégé : le job attend l'approbation d'un relecteur obligatoire
    # (Settings → Environments → release). Seul job doté de contents: write.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
          tools: none

      - name: Construire les archives
        run: tools/build/zip.sh --version-attendue "${{ needs.verifier.outputs.version }}"

      - name: Contrôler SHA256SUMS (deux archives, noms nus)
        working-directory: dist
        run: |
          cat SHA256SUMS
          noms=$(awk '{ sub(/^\*/, "", $2); print $2 }' SHA256SUMS | LC_ALL=C sort | tr '\n' ' ')
          if [ "$noms" != "yume-core.zip yume.zip " ] || grep -Eqv '^[0-9a-f]{64}  [a-z.-]+\.zip$' SHA256SUMS; then
            echo "::error::SHA256SUMS doit lister exactement yume-core.zip et yume.zip, noms nus (format « <sha256>  <nom> »)."
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Créer la release
        uses: softprops/action-gh-release@v3
        with:
          name: Yume Novel ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/yume-core.zip
            dist/yume.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.verifier.outputs.preversion == 'true' }}
          make_latest: ${{ needs.verifier.outputs.preversion == 'true' && 'false' || 'true' }}
