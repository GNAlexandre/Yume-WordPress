# Intégration continue de Yume Novel.
#
#   syntaxe      php -l sur PHP 8.1, 8.2, 8.3 et 8.4 (plugin, bibliothèque vendorisée, thème, outils),
#                blueprints Playground régénérés depuis tools/playground/demo.php
#   normes       PHPCS : WordPress-Extra + WordPress-Docs + phpcs.xml.dist (bloquant : zéro écart)
#   tests        WordPress fr_FR monté comme tools/localenv, puis tests/runner.php, sur la version
#                minimale déclarée (6.6) et la dernière, avec SQLite et MariaDB 10.11 (production) ;
#                comprend la matrice de sécurité REST et les DOCX malveillants (securite-rest,
#                securite-import)
#   rendu        démo (tools/playground/demo.php) servie par php -S, styles calculés des blocs vérifiés
#                dans Chromium (tools/ci/rendu.js) sur WordPress 6.6 et la dernière, puis comparés ;
#                axe-core (WCAG 2.1 A/AA) sur les mêmes pages : aucune violation sérieuse ou critique
#   guide        guide de l'équipe en Word (docs/guide-equipe) à jour par rapport à procedures.md et à
#                ses images : tools/guide/construire.js --verifier (Node seul, ni Chromium ni LibreOffice)
#   archives     dist/yume-core.zip et dist/yume.zip en artefacts téléchargeables
#
# Une seule exécution par changement : déclenché par les pull requests (ouverture, nouveau push
# sur la branche, réouverture ; un push plus récent annule l'exécution en cours), pas par les
# pushes de branche ni par la fusion dans main (le commit de fusion a le contenu déjà testé).
# release.yml ne le rappelle que si la pull request fusionnée n'a pas été testée sur le contenu
# exact du tag. Lancement manuel possible (Actions → CI → Run workflow).
# Documentation : docs/guide-developpeur.md.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  syntaxe:
    name: Syntaxe PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: php -l (erreurs et dépréciations)
        run: tools/build/lint.sh

      - name: Version cohérente et augmentée (tools/build/version.php)
        if: ${{ matrix.php == '8.3' }}
        run: |
          # Une version par commit : cohérente partout, entrée dans CHANGELOG.md, et supérieure à
          # celle du commit précédent (push) ou de la branche cible (pull request).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            php tools/build/version.php --verifier --depuis=FETCH_HEAD
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            php tools/build/version.php --verifier --depuis=HEAD~1
          else
            php tools/build/version.php --verifier
          fi

      - name: Blueprints Playground à jour (tools/playground/demo.php)
        if: ${{ matrix.php == '8.3' }}
        run: php tools/playground/construire.php --verifier

  normes:
    name: Normes de code (PHPCS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Bloquant : phpcs ne signale plus rien sur le dépôt (erreurs et avertissements). Les écarts
    # apparaissent aussi en annotations sur la pull request. Voir docs/guide-developpeur.md.
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Installer WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            "wp-coding-standards/wpcs:^3.1" "phpcompatibility/phpcompatibility-wp:^2.1"
          composer global config bin-dir --absolute --quiet >> "$GITHUB_PATH"

      - name: PHPCS
        run: phpcs -q --no-colors --report-full --report-checkstyle=phpcs-rapport.xml

      - name: Annotations sur la pull request
        if: ${{ always() && hashFiles('phpcs-rapport.xml') != '' }}
        run: cs2pr --graceful-warnings phpcs-rapport.xml

  tests:
    name: Tests WordPress ${{ matrix.wp }} (PHP ${{ matrix.php }}, ${{ matrix.base }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Contrat §0 (WordPress ≥ 6.6) et §13 (les tests tournent sur les deux moteurs) : version
      # minimale et dernière version, SQLite (développement) et MariaDB 10.11 (production).
      matrix:
        include:
          - { php: '8.1', wp: '6.6', base: sqlite }
          - { php: '8.1', wp: '6.6', base: mariadb }
          - { php: '8.4', wp: latest, base: sqlite }
          - { php: '8.4', wp: latest, base: mariadb }
    services:
      # Démarré seulement pour les combinaisons MariaDB (image vide : service ignoré).
      mariadb:
        image: ${{ matrix.base == 'mariadb' && 'mariadb:10.11' || '' }}
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      YUME_ENV: ci
      # Lu par le wp-config.php de tools/localenv/setup.sh : vide = SQLite, mysql = MariaDB.
      YUME_DB_ENGINE: ${{ matrix.base == 'mariadb' && 'mysql' || '' }}
      YUME_DB_HOST: 127.0.0.1
      YUME_DB_USER: root
      YUME_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, mysqli, zip, intl, gd, mbstring, dom, xml, xmlreader
          ini-values: memory_limit=512M
          coverage: none
          tools: wp-cli

      # Même montage que tools/localenv : WordPress téléchargé en français par WP-CLI, intégration
      # SQLite clonée depuis WordPress/sqlite-database-integration, plugin et thème en liens
      # symboliques vers ce dépôt, requêtes HTTP sortantes bloquées (aucun appel réel pendant les tests).
      - name: Installer WordPress ${{ matrix.wp }} (fr_FR, ${{ matrix.base }})
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          set --
          if [ "$WP_VERSION" != latest ]; then
            set -- --version "$WP_VERSION"
          fi
          tools/localenv/setup.sh \
            --dossier "$RUNNER_TEMP/localenv" \
            --source wp-cli \
            --langue fr_FR \
            --bloquer-http \
            "$@"

      - name: WordPress installé
        run: |
          . "$RUNNER_TEMP/localenv/env.sh"
          tools/localenv/wp.sh core version --extra
          tools/localenv/wp.sh eval 'global $wpdb; printf( "Langue %s, base %s (%s), PHP %s\n", get_locale(), DB_ENGINE, $wpdb->db_server_info(), PHP_VERSION );'
          tools/localenv/wp.sh plugin get yume-core --fields=name,status,version
          tools/localenv/wp.sh theme get yume --fields=name,status,version

      - name: Tests (wp eval-file wp-content/plugins/yume-core/tests/runner.php)
        run: |
          . "$RUNNER_TEMP/localenv/env.sh"
          tools/localenv/wp.sh eval-file wp-content/plugins/yume-core/tests/runner.php

      # Contrat §16 : aucune notice PHP pendant les tests. Les messages qui concernent Yume font
      # échouer le job ; les autres (cœur de WordPress, WP-CLI) sont seulement signalés.
      - name: Journal PHP (debug.log)
        if: ${{ always() }}
        run: |
          journal="$RUNNER_TEMP/localenv/wp/wp-content/debug.log"
          if [ ! -s "$journal" ]; then
            echo "debug.log vide."
            exit 0
          fi
          cat "$journal"
          motif='PHP (Fatal error|Parse error|Warning|Notice|Deprecated)|called incorrectly|is deprecated'
          yume='plugins/yume-core/|themes/yume/|yume_|yume/|Yume\\|yume-core'
          if grep -E "$motif" "$journal" | grep -qE "$yume"; then
            echo "::error::Notices ou erreurs PHP liées à Yume dans debug.log (voir ci-dessus)."
            exit 1
          fi
          if grep -qE "$motif" "$journal"; then
            echo "::warning::debug.log contient des messages PHP hors Yume (voir ci-dessus)."
          fi

  # Revue RC-1/RC-2 : sous WordPress 6.6.0, les styles globaux du cœur écrasaient les sélecteurs de
  # bloc non préfixés (titre du panneau de lecture en 28px/700, lien de retour en rose accent…).
  # Ce job ouvre les pages œuvre, tome et chapitre (panneau Paramètres ouvert) de la démo dans
  # Chromium et compare font-size, font-weight et color à tools/ci/rendu-attendus.js, puis y exécute
  # axe-core (WCAG 2.1 A/AA) : une violation « serious » ou « critical » fait échouer le job (AMEL-14).
  # Garder « 6.6 » exact (6.6.0) : la régression ne se reproduit plus à partir de 6.6.1.
  rendu:
    name: Rendu WordPress ${{ matrix.wp }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wp: '6.6' }
          - { php: '8.4', wp: latest }
    env:
      YUME_ENV: rendu
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, zip, intl, gd, mbstring, dom, xml, xmlreader
          ini-values: memory_limit=512M
          coverage: none
          tools: wp-cli

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installer WordPress ${{ matrix.wp }} (fr_FR, SQLite)
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          set --
          if [ "$WP_VERSION" != latest ]; then
            set -- --version "$WP_VERSION"
          fi
          tools/localenv/setup.sh \
            --dossier "$RUNNER_TEMP/localenv" \
            --source wp-cli \
            --langue fr_FR \
            --bloquer-http \
            "$@"

      - name: Contenu de démonstration (tools/playground/demo.php)
        run: |
          . "$RUNNER_TEMP/localenv/env.sh"
          tools/localenv/wp.sh core version --extra
          tools/localenv/wp.sh eval-file tools/playground/demo.php

      # Versions figées par tools/ci/package-lock.json (npm ci).
      - name: Installer Playwright, axe-core et Chromium
        working-directory: tools/ci
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Styles calculés et accessibilité (tools/ci/rendu.sh)
        env:
          YUME_RENDU_JOURNAL: ${{ runner.temp }}/rendu-serveur.log
        run: |
          . "$RUNNER_TEMP/localenv/env.sh"
          version=$(tools/localenv/wp.sh core version)
          tools/ci/rendu.sh --libelle "WordPress $version" --sortie "$RUNNER_TEMP/rendu-mesures.json"

      - name: Journaux (serveur PHP, debug.log)
        if: ${{ failure() }}
        run: |
          cat "$RUNNER_TEMP/rendu-serveur.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/localenv/wp/wp-content/debug.log" 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: rendu-mesures-${{ matrix.wp }}
          path: ${{ runner.temp }}/rendu-mesures.json
          if-no-files-found: ignore
          retention-days: 14

  # Mêmes styles calculés sur les deux versions de WordPress (en plus du tableau des valeurs attendues).
  rendu-comparaison:
    name: Rendu identique sur WordPress 6.6 et la dernière
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: rendu
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: rendu-mesures-*
          path: ${{ runner.temp }}/rendu

      - name: Comparer les mesures
        run: |
          node tools/ci/rendu.js --comparer \
            "$RUNNER_TEMP/rendu/rendu-mesures-6.6/rendu-mesures.json" \
            "$RUNNER_TEMP/rendu/rendu-mesures-latest/rendu-mesures.json"

  # Le DOCX commité doit correspondre à sa source : construire.js écrit l'empreinte SHA-256 de
  # procedures.md, des images citées et de lui-même dans les propriétés du document ; --verifier la
  # recalcule. En cas d'échec : node tools/guide/construire.js, puis commiter le DOCX.
  guide:
    name: Guide de l'équipe (DOCX à jour)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Versions figées par tools/guide/package-lock.json ; aucun navigateur n'est téléchargé.
      - name: Installer les dépendances du guide
        working-directory: tools/guide
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund

      - name: DOCX à jour (tools/guide/construire.js --verifier)
        run: node tools/guide/construire.js --verifier

  archives:
    name: Archives yume-core.zip et yume.zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: syntaxe
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
          tools: none

      - name: Construire
        id: zip
        run: tools/build/zip.sh

      # L'artefact téléchargé est lui-même une archive : la décompresser pour obtenir les deux zips.
      - uses: actions/upload-artifact@v7
        with:
          name: yume-archives-${{ steps.zip.outputs.version_plugin }}-${{ github.run_number }}
          path: |
            dist/yume-core.zip
            dist/yume.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
